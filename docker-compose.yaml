services:
  # ---------------------------------------------------------------------------
  # База данных для сервиса Deal API
  # ---------------------------------------------------------------------------
  deal-postgres-db:
    image: postgres:17
    container_name: deal-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-deal}
    volumes:
      - ./infrastructure/databases/deal:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - neoflex-bank-credit-network

  # ---------------------------------------------------------------------------
  # Nexus - хранилище артефактов и зависимостей
  # ---------------------------------------------------------------------------
  nexus:
    image: sonatype/nexus3:3.76.0
    container_name: nexus
    ports:
      - "8081:8081"
    environment:
      NEXUS_SECURITY_INITIAL_PASSWORD: admin
      NEXUS_SECURITY_RANDOMPASSWORD: false
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status" ]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - neoflex-bank-credit-network

  # ---------------------------------------------------------------------------
  # Prometheus - сбор метрик
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neoflex-bank-credit-network

  # ---------------------------------------------------------------------------
  # Loki - сбор и хранение логов
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neoflex-bank-credit-network

  # ---------------------------------------------------------------------------
  # TEMPO - хранилище трейсов (трассировок)
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - neoflex-bank-credit-network

  # ---------------------------------------------------------------------------
  # Alloy - сбор и отправка телеметрии
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    ports:
      - "9080:9080" # HTTP interface
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP http
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - neoflex-bank-credit-network

  # ---------------------------------------------------------------------------
  # Calculator API - API для вычисления кредитных ставок для пользователя
  # ---------------------------------------------------------------------------
  calculator-api:
    build:
      context: ./calculator-service
      dockerfile: Dockerfile
    container_name: calculator-api
    ports:
      - "8092:8092"
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_EXPORTER_ENDPOINT: ${OTLP_EXPORTER_ENDPOINT:-http://tempo:4318}
    depends_on:
      nexus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-i", "http://localhost:8092/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - neoflex-bank-credit-network

  # ---------------------------------------------------------------------------
  # Deal API
  # ---------------------------------------------------------------------------
  deal-api:
    build:
      context: ./deal-service
      dockerfile: Dockerfile
    container_name: deal-api
    ports:
      - "8093:8093"
    working_dir: /app
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-deal-postgres-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-deal}
      SPRING_PROFILES_ACTIVE: docker
      OTLP_EXPORTER_ENDPOINT: ${OTLP_EXPORTER_ENDPOINT:-http://tempo:4318}
      SHOW_SQL: ${SHOW_SQL:-true}
      FORMAT_SQL: ${FORMAT_SQL:-true}
      HIGHLIGHT_SQL: ${HIGHLIGHT_SQL:-true}
      SLOW_SQL_QUERY_INDICATOR_MS: ${SLOW_SQL_QUERY_INDICATOR_MS:-1500}
      BASE_URL: http://calculator-api:8092
      API_GET_OFFERS: http://calculator-api:8092/api/v1/calculator/offers
      API_CALCULATE_CREDIT: http://calculator-api:8092/api/v1/calculator/calc
#      BASE_URL: ${BASE_URL:-http://calculator-api:8092}
#      API_GET_OFFERS: ${API_GET_OFFERS:-http://calculator-api:8092/api/v1/calculator/offers}
#      API_CALCULATE_CREDIT: ${API_CALCULATE_CREDIT:-http://calculator-api:8092/api/v1/calculator/calc}
    depends_on:
      deal-postgres-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-i", "http://localhost:8093/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - neoflex-bank-credit-network

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      alloy:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_METRICS_ENABLED: "true"
      GF_METRICS_BASIC_AUTH_USERNAME: admin
      GF_METRICS_BASIC_AUTH_PASSWORD: admin
      GF_LOG_LEVEL: info
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - neoflex-bank-credit-network

volumes:
  artifacts:
  tempo_data:
  nexus-data:
  loki_data:
  loki_chunks:
  loki_index:
  loki_rules:
  grafana-data:

networks:
  neoflex-bank-credit-network:
    name: neoflex-bank-credit
    driver: bridge